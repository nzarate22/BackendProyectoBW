<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Brother's Wings</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f8f9fa; color: #333; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 1100px; margin: auto; }
        h1 { color: #d32f2f; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* Pestañas */
        .tabs { display: flex; justify-content: center; margin-bottom: 25px; gap: 10px; }
        .tab-btn { padding: 12px 25px; cursor: pointer; border: 2px solid #ddd; background: white; border-radius: 25px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #d32f2f; color: white; border-color: #d32f2f; }
        
        /* Contenido y Formularios */
        .content { display: none; animation: fadeIn 0.4s; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; background: #fff5f5; padding: 20px; border-radius: 10px; border: 1px solid #ffcdd2; }
        input, textarea, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .full-width { grid-column: span 2; }
        
        /* Botones */
        .actions { margin: 20px 0; display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 22px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-save { background: #2e7d32; color: white; }
        .btn-list { background: #1976d2; color: white; }
        .btn-delete { background: #c62828; color: white; }
        .btn-save:hover { background: #1b5e20; }
        
        /* Tablas */
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th { background: #424242; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover { background-color: #fff9c4; cursor: pointer; }
        .id-column { font-weight: bold; color: #d32f2f; width: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Brother's Wings - Administración</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'clientes')">Clientes</button>
        <button class="tab-btn" onclick="openTab(event, 'ingredientes')">Ingredientes</button>
        <button class="tab-btn" onclick="openTab(event, 'productos')">Productos (Menú)</button>
    </div>

    <div id="clientes" class="content active">
        <h3>Registro de Clientes</h3>
        <div class="form-grid">
            <input type="number" id="idCli" placeholder="ID Automático" readonly style="background: #eee;">
            <input type="text" id="nomCli" placeholder="Nombre(s)">
            <input type="text" id="apeCli" placeholder="Apellidos">
            <input type="text" id="telCli" placeholder="Teléfono (10 dígitos)">
            <input type="text" id="dirCli" class="full-width" placeholder="Dirección completa de entrega">
        </div>
        <div class="actions">
            <button class="btn-save" onclick="guardar('cliente', 'Cli')">Guardar / Actualizar</button>
            <button class="btn-delete" onclick="eliminar('cliente', 'idCli', 'Cli')">Eliminar Selección</button>
            <button class="btn-list" onclick="listar('cliente', 'tablaCli')">Cargar de Clever Cloud</button>
        </div>
        <div class="table-container">
            <table id="tablaCli">
                <thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Teléfono</th><th>Dirección</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="ingredientes" class="content">
        <h3>Inventario de Almacén</h3>
        <div class="form-grid">
            <input type="number" id="idIng" placeholder="ID Automático" readonly style="background: #eee;">
            <input type="text" id="nomIng" placeholder="Nombre del Insumo">
            <input type="number" id="stkActIng" placeholder="Stock Actual">
            <input type="number" id="stkMinIng" placeholder="Stock Mínimo">
            <input type="text" id="uniIng" placeholder="Unidad (Pieza, Kg, Litro)">
        </div>
        <div class="actions">
            <button class="btn-save" onclick="guardar('ingrediente', 'Ing')">Actualizar Inventario</button>
            <button class="btn-delete" onclick="eliminar('ingrediente', 'idIng', 'Ing')">Borrar Insumo</button>
            <button class="btn-list" onclick="listar('ingrediente', 'tablaIng')">Refrescar Stock</button>
        </div>
        <div class="table-container">
            <table id="tablaIng">
                <thead><tr><th>ID</th><th>Insumo</th><th>Stock Actual</th><th>Mínimo</th><th>Unidad</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    
    <div id="productos" class="content">
        <h3>Catálogo de Menú</h3>
        <div class="form-grid">
            <input type="number" id="idPro" placeholder="ID Automático" readonly style="background: #eee;">
            <input type="text" id="nomPro" placeholder="Nombre del Combo/Producto">
            <input type="number" id="prePro" placeholder="Precio de Venta ($)">
            <input type="number" id="maxPro" placeholder="Máximo de Salsas permitidas">
            <textarea id="desPro" class="full-width" placeholder="Descripción detallada para el cliente"></textarea>
        </div>
        <div class="actions">
            <button class="btn-save" onclick="guardar('producto', 'Pro')">Guardar Cambios Menú</button>
            <button class="btn-delete" onclick="eliminar('producto', 'idPro', 'Pro')">Quitar de Menú</button>
            <button class="btn-list" onclick="listar('producto', 'tablaPro')">Listar Menú</button>
        </div>
        <div class="table-container">
            <table id="tablaPro">
                <thead><tr><th>ID</th><th>Nombre del Combo</th><th>Precio</th><th>Salsas</th><th>Descripción</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8080/";

    // Control de Pestañas
    function openTab(evt, tabName) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    // LISTAR: Obtiene datos de Clever Cloud y llena las tablas
    async function listar(entidad, tablaId) {
        try {
            const res = await fetch(API_URL + entidad);
            const datos = await res.json();
            const tbody = document.querySelector(`#${tablaId} tbody`);
            tbody.innerHTML = "";
            
            datos.forEach(item => {
                let tr = document.createElement('tr');
                // Al hacer clic en la fila, cargamos los datos en el formulario correspondiente
                tr.onclick = () => {
                    if(entidad === 'cliente') seleccionarCli(item);
                    if(entidad === 'ingrediente') seleccionarIng(item);
                    if(entidad === 'producto') seleccionarPro(item);
                };

                if(entidad === 'cliente') {
                    tr.innerHTML = `<td class="id-column">${item.idCliente}</td><td>${item.nombre}</td><td>${item.apellido}</td><td>${item.telefono}</td><td>${item.direccion}</td>`;
                } else if(entidad === 'ingrediente') {
                    tr.innerHTML = `<td class="id-column">${item.idIngrediente}</td><td>${item.nombre}</td><td>${item.stockActual}</td><td>${item.stockMinimo}</td><td>${item.unidadMedida}</td>`;
                } else {
                    tr.innerHTML = `<td class="id-column">${item.idProducto}</td><td>${item.nombreCombo}</td><td>$${item.precio}</td><td>${item.maxSalsas}</td><td>${item.descripcion}</td>`;
                }
                tbody.appendChild(tr);
            });
        } catch (e) { alert("Error al conectar con el servidor"); }
    }

    // SELECCIONAR: Pinta los datos de la tabla en los inputs
    function seleccionarCli(c) {
        document.getElementById('idCli').value = c.idCliente;
        document.getElementById('nomCli').value = c.nombre;
        document.getElementById('apeCli').value = c.apellido;
        document.getElementById('telCli').value = c.telefono;
        document.getElementById('dirCli').value = c.direccion;
    }

    function seleccionarIng(i) {
        document.getElementById('idIng').value = i.idIngrediente;
        document.getElementById('nomIng').value = i.nombre;
        document.getElementById('stkActIng').value = i.stockActual;
        document.getElementById('stkMinIng').value = i.stockMinimo;
        document.getElementById('uniIng').value = i.unidadMedida;
    }

    function seleccionarPro(p) {
        document.getElementById('idPro').value = p.idProducto;
        document.getElementById('nomPro').value = p.nombreCombo;
        document.getElementById('prePro').value = p.precio;
        document.getElementById('maxPro').value = p.maxSalsas;
        document.getElementById('desPro').value = p.descripcion;
    }

    // GUARDAR: Detecta si es POST (nuevo) o PUT (modificar) según el ID
    async function guardar(entidad, suf) {
        const id = document.getElementById(`id${suf}`).value;
        const metodo = id ? 'PUT' : 'POST'; // Si tiene ID, modificamos
        
        let payload = {};
        if(entidad === 'cliente') {
            payload = { idCliente: id || null, nombre: document.getElementById('nomCli').value, apellido: document.getElementById('apeCli').value, telefono: document.getElementById('telCli').value, direccion: document.getElementById('dirCli').value };
        } else if(entidad === 'ingrediente') {
            payload = { idIngrediente: id || null, nombre: document.getElementById('nomIng').value, stockActual: document.getElementById('stkActIng').value, stockMinimo: document.getElementById('stkMinIng').value, unidadMedida: document.getElementById('uniIng').value };
        } else {
            payload = { idProducto: id || null, nombreCombo: document.getElementById('nomPro').value, precio: document.getElementById('prePro').value, maxSalsas: document.getElementById('maxPro').value, descripcion: document.getElementById('desPro').value };
        }

        const res = await fetch(API_URL + entidad, {
            method: metodo,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if(res.ok) {
            alert("Operación exitosa en Clever Cloud");
            listar(entidad, `tabla${suf}`);
            limpiarCampos(suf);
        }
    }

    // ELIMINAR: Requiere que se haya seleccionado un registro primero
    async function eliminar(entidad, idInput, suf) {
        const id = document.getElementById(idInput).value;
        if(!id) return alert("Por favor, selecciona un registro de la tabla primero.");
        
        if(confirm("¿Estás seguro de eliminar este registro?")) {
            await fetch(`${API_URL}${entidad}?id=${id}`, { method: 'DELETE' });
            listar(entidad, `tabla${suf}`);
            limpiarCampos(suf);
        }
    }

    function limpiarCampos(suf) {
        document.querySelectorAll(`#${suf.toLowerCase() === 'cli' ? 'clientes' : suf.toLowerCase() === 'ing' ? 'ingredientes' : 'productos'} input, textarea`).forEach(i => i.value = "");
    }
</script>
</body>
</html>
